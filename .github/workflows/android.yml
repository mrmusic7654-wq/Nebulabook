name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1

      - name: Compile debug APK
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --stacktrace :app:assembleDebug > gradle-build.log 2>&1
          result=$?
          cat gradle-build.log
          if [ "$result" -ne 0 ]; then
            echo '### Gradle compile diagnostics' >> "$GITHUB_STEP_SUMMARY"
            tail -n 100 gradle-build.log >> "$GITHUB_STEP_SUMMARY"
            grep -E '^(e: |.*error:|FAILURE:|Execution failed for task|Could not resolve|Could not find|\* What went wrong:)' gradle-build.log | tail -n 30 | while IFS= read -r line; do
              echo "::error title=Gradle diagnostic::$line"
            done
            exit "$result"
          fi

      - name: Run unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: nebulabook-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
